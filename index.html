<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quiz: Preservação da Floresta</title>
<style>
:root{
  --bg:#0d1712; --bg2:#12211a; --panel:#172a21; --line:#2a4538;
  --ink:#eef3e8; --mute:#9db3a4;
  --moss:#9bd16b; --amber:#f4b942; --clay:#e8785a;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  background:
    radial-gradient(1100px 600px at 85% -10%, #214030 0%, transparent 60%),
    radial-gradient(700px 500px at -10% 110%, #1b3326 0%, transparent 60%),
    var(--bg);
  color:var(--ink);
  font-family:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
  line-height:1.5;
}
.serif{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--amber);outline-offset:3px}
[tabindex="-1"]:focus,[tabindex="-1"]:focus-visible{outline:none}

/* ===== layout ===== */
.app{display:grid;grid-template-columns:310px 1fr;min-height:100vh;position:relative;z-index:1}
.rail{
  padding:34px 28px;border-right:1px solid var(--line);
  background:linear-gradient(180deg,rgba(23,42,33,.92),rgba(13,23,18,.55));
  display:flex;flex-direction:column;gap:30px;
}
.stage{display:flex;align-items:center;justify-content:center;padding:48px 40px 130px}
.card{width:min(720px,100%);animation:rise .45s ease both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* ===== rail ===== */
.brand small{display:block;letter-spacing:.22em;text-transform:uppercase;font-size:11px;color:var(--moss);margin-bottom:6px}
.brand strong{font-size:25px;line-height:1.15;font-weight:700}
.label{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
.player b{display:block;font-size:19px;margin-top:2px;word-break:break-word}
.meter-top{display:flex;justify-content:space-between;align-items:baseline}
.meter-top span:last-child{font-weight:700;color:var(--moss)}
.bar{height:10px;border-radius:99px;background:var(--bg);border:1px solid var(--line);margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#5e9a3a,var(--moss));transition:width .6s cubic-bezier(.2,.8,.2,1)}

.trail{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.trail li{display:flex;align-items:center;gap:12px;position:relative;padding:7px 0;color:var(--mute);font-size:14px}
.trail li::before{content:"";width:14px;height:14px;border-radius:50%;border:2px solid var(--line);background:var(--bg);flex:none;z-index:1;transition:.3s}
.trail li:not(:last-child)::after{content:"";position:absolute;left:6px;top:calc(50% + 7px);height:calc(100% - 14px);width:2px;background:var(--line)}
.trail li.ok::before{background:var(--moss);border-color:var(--moss)}
.trail li.no::before{background:var(--clay);border-color:var(--clay)}
.trail li.now{color:var(--ink);font-weight:600}
.trail li.now::before{border-color:var(--amber);box-shadow:0 0 0 4px rgba(244,185,66,.22)}

/* ===== telas ===== */
.kicker{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--amber);margin:0 0 14px}
h1,h2{margin:0}
h1{font-size:clamp(34px,5vw,52px);line-height:1.05}
h2{font-size:clamp(24px,3.2vw,32px);line-height:1.25;outline:none}
.lead{color:var(--mute);font-size:17px;margin:18px 0 30px;max-width:56ch}

.start label{display:block;font-weight:600;margin-bottom:8px}
.field{display:flex;gap:12px;flex-wrap:wrap}
.field input{
  flex:1 1 240px;min-width:0;padding:15px 16px;border-radius:12px;
  background:var(--bg2);border:1.5px solid var(--line);font-size:18px;
}
.field input::placeholder{color:#5d7766}
.field input:focus{border-color:var(--moss);outline:none;box-shadow:0 0 0 4px rgba(155,209,107,.18)}
.hint{font-size:13px;color:var(--mute);margin:10px 0 0}
.err{color:var(--clay);font-weight:600;min-height:1.5em;margin:10px 0 0;font-size:14px}

.btn{
  border:0;border-radius:12px;padding:15px 26px;font-weight:700;font-size:16px;cursor:pointer;
  background:var(--moss);color:#12220b;transition:transform .15s,filter .15s;
}
.btn:hover{filter:brightness(1.08);transform:translateY(-2px)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}

.opts{display:flex;flex-direction:column;gap:12px;margin-top:28px}
.opt{
  display:grid;grid-template-columns:44px 1fr 26px;gap:16px;align-items:center;
  width:100%;text-align:left;background:transparent;border:1.5px solid var(--line);
  border-radius:14px;padding:14px 18px 14px 14px;cursor:pointer;font-size:17px;
  transition:border-color .2s,background .2s,transform .2s,opacity .2s;
}
.opt .k{
  width:44px;height:44px;border-radius:10px;display:grid;place-items:center;font-weight:700;
  background:var(--bg2);border:1px solid var(--line);color:var(--moss);transition:.2s;
}
.opt .mark{font-size:20px;font-weight:700;text-align:center}
.opt:hover:not(:disabled){border-color:var(--moss);background:rgba(155,209,107,.07);transform:translateX(4px)}
.opt:disabled{cursor:default;color:var(--ink)}
.opt.ok{border-color:var(--moss);background:rgba(155,209,107,.14)}
.opt.ok .k{background:var(--moss);color:#12220b;border-color:var(--moss)}
.opt.ok .mark{color:var(--moss)}
.opt.no{border-color:var(--clay);background:rgba(232,120,90,.12)}
.opt.no .k{background:var(--clay);color:#2a0f08;border-color:var(--clay)}
.opt.no .mark{color:var(--clay)}
.opt.dim{opacity:.5}

.fb{margin-top:22px;padding:18px 20px;border-radius:14px;background:var(--panel);border-left:5px solid var(--moss);animation:rise .35s ease both}
.fb.bad{border-left-color:var(--clay)}
.fb h3{margin:0 0 4px;font-size:17px}
.fb p{margin:0 0 16px;color:#cfdcd2}

/* resultado */
.score{display:flex;align-items:baseline;gap:10px;margin:6px 0 4px}
.score b{font-size:clamp(56px,9vw,84px);line-height:1;color:var(--moss)}
.score span{font-size:18px;color:var(--mute)}
.score b.lose{color:var(--clay)}
h2.big{font-size:clamp(40px,7vw,64px);line-height:1.05;margin-bottom:6px}
h2.win{color:var(--moss)} h2.lose{color:var(--clay)}
.bar i.low{background:linear-gradient(90deg,#b4472d,var(--clay))}
.rule{font-size:12px;color:var(--mute);margin:8px 0 0}
.review{list-style:none;margin:24px 0 28px;padding:0;display:flex;flex-direction:column;gap:8px}
.review li{display:grid;grid-template-columns:26px 1fr;gap:10px;padding:12px 14px;border-radius:12px;background:var(--panel);font-size:15px}
.review .m{font-weight:700}
.review .ok{color:var(--moss)} .review .no{color:var(--clay)}
.review small{display:block;color:var(--mute);margin-top:2px}

/* silhueta de pinheiros só com CSS */
.trees{position:fixed;left:0;right:0;bottom:0;height:90px;pointer-events:none;z-index:0}
.trees::before,.trees::after{content:"";position:absolute;left:0;right:0;bottom:0}
.trees::before{height:90px;opacity:.5;
  background:linear-gradient(135deg,#122419 25%,transparent 25%) -45px 0,linear-gradient(225deg,#122419 25%,transparent 25%) -45px 0;
  background-size:90px 90px}
.trees::after{height:56px;
  background:linear-gradient(135deg,#0a120d 25%,transparent 25%) -28px 0,linear-gradient(225deg,#0a120d 25%,transparent 25%) -28px 0;
  background-size:56px 56px}

/* ===== celular ===== */
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .rail{flex-direction:row;flex-wrap:wrap;align-items:center;gap:12px 20px;padding:14px 16px;border-right:0;border-bottom:1px solid var(--line)}
  .brand{flex:1 1 100%}
  .brand small{display:none}
  .brand strong{font-size:18px}
  .player{flex:0 1 auto}
  .player b{font-size:16px}
  .meter{flex:1 1 150px}
  .trail{flex:1 1 100%;flex-direction:row;gap:10px;justify-content:space-between}
  .trail li{padding:2px 0;flex:1;font-size:0}
  .trail li::after{display:none}
  .trail li::before{width:100%;height:6px;border-radius:99px;border-width:0;background:var(--line)}
  .trail li.ok::before{background:var(--moss)}
  .trail li.no::before{background:var(--clay)}
  .trail li.now::before{background:var(--amber);box-shadow:none}
  .stage{padding:28px 16px 120px;align-items:flex-start}
  .opt{font-size:16px;grid-template-columns:40px 1fr 22px;gap:12px}
  .opt .k{width:40px;height:40px}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<div class="app">
  <aside class="rail" aria-label="Seu progresso">
    <div class="brand"><small>Quiz ambiental</small><strong class="serif">Preservação<br>da Floresta</strong></div>
    <div class="player"><span class="label">Explorador</span><b id="nickShow">—</b></div>
    <div class="meter">
      <div class="meter-top"><span class="label">Vida da floresta</span><span id="pct">0%</span></div>
      <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50" id="bar"><i id="fill"></i></div>
      <p class="rule">Acertou: +15% · Errou: −20%<br>100% = vitória · 0% = game over</p>
    </div>
    <ol class="trail" id="trail" aria-label="Etapas"></ol>
  </aside>
  <main class="stage"><section class="card" id="screen" aria-live="polite"></section></main>
</div>
<div class="trees" aria-hidden="true"></div>
<noscript>Ative o JavaScript para jogar o quiz.</noscript>

<script>
/* ============ PERGUNTAS ============ */
/* ok:true marca a resposta correta. A ordem das opções é sorteada a cada partida. */
const QUIZ = [
  { tema:"Lixo no chão",
    texto:"Você chega a uma floresta que já foi cheia de vida. Hoje o rio está secando e há lixo espalhado por todo lado. Por onde começar?",
    opcoes:[
      {t:"Jogar mais lixo no chão, afinal o lugar já está sujo.", ok:false},
      {t:"Chamar os amigos para ajudar na limpeza.", ok:true},
      {t:"Recolher só o lixo que estiver no seu caminho e seguir viagem.", ok:false}],
    boa:"Em grupo, a limpeza rende muito mais. Recolher só o que está no caminho ajuda um pouco, mas deixa o problema quase todo para trás.",
    ruim:"A melhor escolha era chamar os amigos: a limpeza de uma área grande é muito mais rápida e eficiente em mutirão." },

  { tema:"Destino do lixo",
    texto:"Seus amigos chegaram e vocês juntaram uma boa parte do lixo. O que fazer com ele?",
    opcoes:[
      {t:"Enterrar o lixo perto das árvores.", ok:false},
      {t:"Jogar no rio para a correnteza levar embora.", ok:false},
      {t:"Separar o lixo para reciclar.", ok:true}],
    boa:"Separar para reciclar evita nova poluição e dá outro destino aos materiais.",
    ruim:"O certo era separar para reciclar. Enterrar contamina o solo e as raízes, e jogar no rio apenas leva a poluição para outro lugar." },

  { tema:"Árvore jovem",
    texto:"À sua frente, uma árvore jovem está começando a crescer. Qual é a melhor atitude?",
    opcoes:[
      {t:"Quebrar a árvore para abrir caminho.", ok:false},
      {t:"Cuidar dela e colocar uma cerca para protegê-la.", ok:true},
      {t:"Ignorar: ela cresce sozinha, não precisa de ninguém.", ok:false}],
    boa:"Uma muda é frágil. Protegida, ela cresce, dá sombra, abriga animais e ajuda a manter o solo úmido.",
    ruim:"Mudas são frágeis e podem ser pisadas ou quebradas. Cuidar e proteger é o que garante que ela vire uma árvore adulta." },

  { tema:"Rio quase seco",
    texto:"Você chega ao rio e vê que a água está quase desaparecendo. Algumas plantas ainda crescem nas margens. O que fazer?",
    opcoes:[
      {t:"Cortar as árvores que ainda estão de pé.", ok:false},
      {t:"Não fazer nada: o rio se resolve sozinho.", ok:false},
      {t:"Plantar novas árvores perto do rio e proteger as margens.", ok:true}],
    boa:"A vegetação das margens (mata ciliar) segura o solo, evita que ele caia no rio e ajuda a manter a água.",
    ruim:"Sem vegetação nas margens, a terra desmorona para dentro do rio e ele seca ainda mais. O certo era plantar e proteger." },

  { tema:"Fogueira acesa",
    texto:"Você encontra uma pequena fogueira acesa, sem ninguém por perto. O que faz?",
    opcoes:[
      {t:"Apagar a fogueira por completo, com água e terra, para evitar um incêndio.", ok:true},
      {t:"Deixar acesa: é só uma fogueirinha.", ok:false},
      {t:"Ir embora e torcer para o fogo apagar sozinho.", ok:false}],
    boa:"Fogo pequeno pode virar incêndio em minutos. Se o fogo já estiver grande, não tente enfrentá-lo: ligue para os bombeiros (193).",
    ruim:"Uma brasa esquecida pode incendiar a mata inteira. O certo era apagar por completo e, se o fogo estivesse grande, ligar para os bombeiros (193)." },

  { tema:"Nascente",
    texto:"A floresta está cada vez mais degradada. Entre as árvores, você encontra uma nascente escondida e cheia de lixo. E agora?",
    opcoes:[
      {t:"Jogar lixo dentro da nascente.", ok:false},
      {t:"Ignorar a nascente e seguir caminho.", ok:false},
      {t:"Limpar a nascente e protegê-la.", ok:true}],
    boa:"É da nascente que o rio nasce. Cuidar dela é cuidar de toda a água que vem depois.",
    ruim:"A nascente é o começo do rio: se ela fica suja ou seca, tudo o que vem depois sofre. O certo era limpar e proteger." },

  { tema:"Animal preso",
    texto:"Você vê um animal silvestre preso entre redes e restos de lixo. Qual é a melhor atitude?",
    opcoes:[
      {t:"Seguir em frente: não é problema seu.", ok:false},
      {t:"Levar o animal para criar em casa.", ok:false},
      {t:"Pedir ajuda ao guarda-florestal e devolver o animal à floresta.", ok:true}],
    boa:"Profissionais sabem socorrer sem machucar o animal, e a floresta é o lugar dele.",
    ruim:"Animal silvestre deve ficar na natureza, e mantê-lo em casa sem autorização é crime ambiental. O certo era chamar o guarda-florestal e devolvê-lo ao habitat." },

  { tema:"Rede de pesca",
    texto:"As plantas das margens reviveram! Mas você encontra uma rede de pesca abandonada, presa no rio. O que faz?",
    opcoes:[
      {t:"Retirar a rede do rio e dar o destino correto a ela.", ok:true},
      {t:"Deixar a rede onde está.", ok:false},
      {t:"Cortar a rede em pedaços e deixar tudo na água.", ok:false}],
    boa:"Redes abandonadas prendem peixes, aves e outros bichos por muito tempo. Tirá-las do rio protege a vida da água.",
    ruim:"Redes e pedaços de rede continuam capturando animais por anos. O certo era retirá-la do rio e descartá-la corretamente." },

  { tema:"Decisão final",
    texto:"Os animais voltaram e a floresta se recupera. Falta uma última decisão para garantir que tudo continue assim.",
    opcoes:[
      {t:"Voltar a destruir a floresta.", ok:false},
      {t:"Plantar sementes nativas e continuar cuidando.", ok:true},
      {t:"Deixar lixo perto das mudas.", ok:false}],
    boa:"Espécies nativas são as que melhor se encaixam no ambiente e dão abrigo e alimento aos animais da região.",
    ruim:"Para a floresta se manter viva, o caminho é plantar sementes nativas e continuar cuidando. Destruir ou sujar desfaz todo o trabalho." }
];
/* ============ ESTADO ============ */
const LETRAS = ["A","B","C"];
const VIDA_INICIAL = 50, GANHO = 15, PERDA = 20; // acerta +15, erra -20; 100% vence, 0% = game over
const $screen = document.getElementById("screen");
const $trail = document.getElementById("trail");
let nick = "";
let st = null; // estado da partida

try { nick = localStorage.getItem("floresta_nick") || ""; } catch(e) {}

function el(tag, cls, txt){
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (txt != null) e.textContent = txt;
  return e;
}
function shuffle(a){
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* ============ PAINEL LATERAL ============ */
function drawRail(){
  document.getElementById("nickShow").textContent = (st && st.nick) || "—";
  $trail.replaceChildren();
  QUIZ.forEach((q, i) => {
    const li = el("li", null);
    const lbl = el("span", "lbl", q.tema);
    li.appendChild(lbl);
    const r = st && st.respostas[i];
    if (r) li.className = r.certa ? "ok" : "no";
    else if (st && st.etapa === i && !st.fim) li.className = "now";
    $trail.appendChild(li);
  });
  const pct = st ? st.vida : VIDA_INICIAL;
  document.getElementById("pct").textContent = pct + "%";
  const fill = document.getElementById("fill");
  fill.style.width = pct + "%";
  fill.classList.toggle("low", pct <= 30);
  document.getElementById("bar").setAttribute("aria-valuenow", pct);
}

/* ============ TELA INICIAL ============ */
function telaInicio(){
  st = null;
  drawRail();
  const box = el("div", "start");
  box.appendChild(el("p", "kicker", "Missão na floresta"));
  const h = el("h1", "serif", "Devolva a harmonia à floresta");
  box.appendChild(h);
  box.appendChild(el("p", "lead",
    "A floresta já foi cheia de vida. Hoje o rio está secando, há lixo espalhado e muitos animais foram embora. " +
    "Escolha a melhor atitude em cada situação. Cada decisão muda a vida da floresta: se ela chegar a 100% você vence, " +
    "mas se chegar a 0% é game over, e isso pode acontecer antes mesmo da última pergunta."));

  const form = el("form");
  form.noValidate = true;
  const lab = el("label", null, "Escolha seu nickname");
  lab.htmlFor = "nick";
  const row = el("div", "field");
  const inp = document.createElement("input");
  inp.id = "nick"; inp.type = "text"; inp.maxLength = 16; inp.autocomplete = "off";
  inp.placeholder = "ex.: GuardiaoVerde"; inp.value = nick;
  inp.setAttribute("aria-describedby", "nickErr");
  const go = el("button", "btn", "Começar a missão");
  go.type = "submit";
  row.append(inp, go);
  const err = el("p", "err"); err.id = "nickErr"; err.setAttribute("role", "alert");
  form.append(lab, row, err, el("p", "hint", "De 2 a 16 caracteres. Seu nickname aparece durante o quiz e no resultado."));
  form.addEventListener("submit", ev => {
    ev.preventDefault();
    const v = inp.value.trim().replace(/\s+/g, " ");
    if (v.length < 2){ err.textContent = "Digite um nickname com pelo menos 2 caracteres."; inp.focus(); return; }
    nick = v;
    try { localStorage.setItem("floresta_nick", nick); } catch(e) {}
    novaPartida();
  });
  box.appendChild(form);
  $screen.replaceChildren(box);
  inp.focus();
}

/* ============ PARTIDA ============ */
function novaPartida(){
  st = {
    nick, etapa: 0, pontos: 0, vida: VIDA_INICIAL, desfecho: null, fim: false, travado: false,
    respostas: [],
    ordem: QUIZ.map(q => shuffle(q.opcoes))
  };
  telaPergunta();
}

function telaPergunta(){
  st.travado = false;
  drawRail();
  const q = QUIZ[st.etapa];
  const box = el("div");
  box.appendChild(el("p", "kicker", "Pergunta " + (st.etapa + 1) + " de " + QUIZ.length + " · " + q.tema));
  const h = el("h2", "serif", q.texto);
  h.tabIndex = -1;
  box.appendChild(h);

  const list = el("div", "opts");
  list.setAttribute("role", "group");
  list.setAttribute("aria-label", "Alternativas");
  st.ordem[st.etapa].forEach((o, i) => {
    const b = el("button", "opt");
    b.type = "button";
    b.append(el("span", "k", LETRAS[i]), el("span", "txt", o.t), el("span", "mark", ""));
    b.addEventListener("click", () => responder(i));
    list.appendChild(b);
  });
  box.appendChild(list);
  const fbSlot = el("div"); fbSlot.id = "fb";
  box.appendChild(fbSlot);
  $screen.replaceChildren(box);
  h.focus({preventScroll:true});
}

function responder(i){
  if (!st || st.travado || st.fim) return;
  st.travado = true;
  const ops = st.ordem[st.etapa];
  const q = QUIZ[st.etapa];
  const certa = ops[i].ok;
  const idxOk = ops.findIndex(o => o.ok);
  if (certa) st.pontos++;
  st.vida = Math.max(0, Math.min(100, st.vida + (certa ? GANHO : -PERDA)));
  const ultima = st.etapa === QUIZ.length - 1;
  if (st.vida >= 100) st.desfecho = "win";
  else if (st.vida <= 0) st.desfecho = "lose";
  else if (ultima) st.desfecho = st.vida >= VIDA_INICIAL ? "win" : "lose";
  st.respostas[st.etapa] = { certa, escolhida: ops[i].t, correta: ops[idxOk].t };

  const btns = $screen.querySelectorAll(".opt");
  btns.forEach((b, k) => {
    b.disabled = true;
    const mk = b.querySelector(".mark");
    if (k === idxOk){ b.classList.add("ok"); mk.textContent = "✓"; }
    else if (k === i){ b.classList.add("no"); mk.textContent = "✗"; }
    else b.classList.add("dim");
  });

  const fb = el("div", "fb" + (certa ? "" : " bad"));
  fb.appendChild(el("h3", null, certa ? "Boa escolha!" : "Essa não foi a melhor escolha"));
  fb.appendChild(el("p", null, certa ? q.boa : q.ruim));
  if (st.desfecho === "win" && !ultima)
    fb.appendChild(el("p", null, "A vida da floresta chegou a 100%: a missão está cumprida!"));
  if (st.desfecho === "lose" && !ultima)
    fb.appendChild(el("p", null, "A vida da floresta chegou a 0%. Não deu para salvá-la."));
  const nx = el("button", "btn", st.desfecho ? "Ver resultado" : "Próxima pergunta");
  nx.type = "button";
  nx.addEventListener("click", () => {
    if (st.desfecho){ st.fim = true; telaFim(); }
    else { st.etapa++; telaPergunta(); }
  });
  fb.appendChild(nx);
  document.getElementById("fb").appendChild(fb);
  drawRail();
  nx.focus();
}
/* ============ RESULTADO ============ */
function telaFim(){
  drawRail();
  const n = st.respostas.length, p = st.pontos;
  const venceu = st.desfecho === "win";
  let titulo, msg;
  if (venceu){
    titulo = "Você venceu!";
    msg = "O rio voltou a correr, as árvores cresceram, os animais retornaram e a floresta voltou a ter vida. Parabéns, " + st.nick + "!";
  } else {
    titulo = "Game over";
    msg = "A floresta não conseguiu se recuperar, " + st.nick + ". Sem árvores, água limpa e animais, o equilíbrio do ambiente foi perdido. Mas dá para tentar outra vez!";
  }
  const box = el("div");
  box.appendChild(el("p", "kicker", venceu ? "Missão cumprida" : "Missão fracassada"));
  const h = el("h2", "serif big " + (venceu ? "win" : "lose"), titulo); h.tabIndex = -1;
  box.appendChild(h);
  const sc = el("div", "score");
  sc.append(el("b", "serif " + (venceu ? "" : "lose"), String(p)),
            el("span", null, "de " + n + (n === 1 ? " resposta certa" : " respostas certas") + " · vida da floresta: " + st.vida + "%"));
  box.appendChild(sc);
  box.appendChild(el("p", "lead", msg));

  const ul = el("ul", "review");
  st.respostas.forEach((r, i) => {
    const li = el("li");
    li.appendChild(el("span", "m " + (r.certa ? "ok" : "no"), r.certa ? "✓" : "✗"));
    const d = el("div");
    d.appendChild(document.createTextNode((i + 1) + ". " + QUIZ[i].tema));
    const s = el("small", null, r.certa ? r.escolhida : "Você escolheu: " + r.escolhida);
    d.appendChild(s);
    if (!r.certa) d.appendChild(el("small", null, "Melhor escolha: " + r.correta));
    li.appendChild(d);
    ul.appendChild(li);
  });
  box.appendChild(ul);

  const again = el("button", "btn", "Jogar de novo");
  again.type = "button";
  again.addEventListener("click", telaInicio);
  box.appendChild(again);
  $screen.replaceChildren(box);
  h.focus({preventScroll:true});
  window.scrollTo(0, 0);
}

/* atalhos: A/B/C ou 1/2/3 */
document.addEventListener("keydown", e => {
  if (!st || st.travado || st.fim) return;
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const m = { "1":0, "2":1, "3":2, "a":0, "b":1, "c":2 }[e.key.toLowerCase()];
  if (m !== undefined) responder(m);
});

telaInicio();
</script>
